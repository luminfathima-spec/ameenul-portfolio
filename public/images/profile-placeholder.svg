<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="lavenderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4FF"/>
      <stop offset="100%" stop-color="#EDE5FF"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7952C7"/>
      <stop offset="100%" stop-color="#56358E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" rx="24" fill="url(#lavenderBg)"/>
  <rect x="2" y="2" width="396" height="476" rx="22" fill="none" stroke="#E8E2F1" stroke-width="2"/>
  
  <!-- Subtle decorative tech grid dots -->
  <g opacity="0.35" fill="#7952C7">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="80" cy="40" r="2"/>
    <circle cx="120" cy="40" r="2"/>
    <circle cx="280" cy="440" r="2"/>
    <circle cx="320" cy="440" r="2"/>
    <circle cx="360" cy="440" r="2"/>
  </g>

  <!-- Central Avatar Frame -->
  <circle cx="200" cy="180" r="80" fill="#FFFFFF" stroke="#E8E2F1" stroke-width="4"/>
  <circle cx="200" cy="180" r="70" fill="url(#violetGrad)"/>
  
  <!-- Monogram Initials -->
  <text x="200" y="200" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF" text-anchor="middle">AL</text>
  
  <!-- Text Labels -->
  <text x="200" y="300" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="18" font-weight="700" fill="#202033" text-anchor="middle">Ameenul Lumin Fathima M.</text>
  <text x="200" y="325" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="500" fill="#7952C7" text-anchor="middle">Software Developer &bull; MCA</text>

  <!-- Upload reminder badge -->
  <rect x="75" y="370" width="250" height="42" rx="10" fill="#FFFFFF" stroke="#D7C7F4" stroke-width="1.5"/>
  <text x="200" y="396" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="500" fill="#68677A" text-anchor="middle">
    Ready for your photo (public/images/profile.jpg)
  </text>
</svg>
